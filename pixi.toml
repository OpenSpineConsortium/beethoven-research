# Deterministic environment for beethoven-research, the research pipeline of the Beethoven engine:
# REFORMS, CLAIM and the studies (REFORMS Module: reproducibility). The lock beside this file
# (pixi.lock) is the record: exact versions, build strings and hashes, solved for the grid's
# platform. A run is only reproducible if it is reconstructed from the lock alone, so CI installs
# with --locked and never re-solves silently.
#
# Scope note: this is the verification stack beethoven-qa's gate needs, the same lines as
# beethoven-qa's pixi.toml, and nothing else yet. The medical stack (pydicom/MONAI, Goal 6) and the
# telemetry stack (W&B/CodeCarbon, Goal 2) are added as their own pixi features with their own
# Linear issues, each in a change that re-locks on purpose, so this lock stays small and solvable
# rather than pretending to pin a pipeline that does not exist yet. The orchestrator (Metaflow,
# decision D3) and the substrate image are beethoven-agents' (plan/REPO_SPLIT.md section 2).

[workspace]
name = "beethoven-research"
version = "0.0.0"
description = "Beethoven research pipeline: REFORMS, CLAIM and the studies"
channels = ["conda-forge"]
# linux-64 is what runs: a study runs inside the Apptainer image on the cluster's x86_64 compute
# nodes, and the lock must match the platform a run actually executes on. The three laptop
# platforms this lock once carried were bee's, the account switch, and left with it for
# beethoven-agents at the split (2026-10-04); nothing here runs on a laptop.
platforms = [{ name = "linux-64-glibc234", platform = "linux-64", glibc = "2.34" }]
# glibc 2.34 or later, because jscpd (the duplication detector, from PyPI) ships manylinux_2_34
# wheels only; the entry is named apart from its subdirectory because it states that floor, as
# beethoven-qa's pixi.toml does. The Apptainer image (ubuntu:24.04), GitHub's runners and a cloud
# session all have it; the grid's CentOS 7 login node (2.17) never runs the gate, by the grid rules.
# Same-name derivation is off so the solve does not depend on an external conda<->PyPI mapping
# host. The cost is an overlap the lock does record: CrossHair's PyPI requirements bring PyPI copies
# of packaging, typing-extensions and mypy-extensions beside conda-forge's, at the same versions,
# and `pixi install` warns that the PyPI files overwrite the conda ones. Harmless while the versions
# match; revisit if a lock ever pins them apart.
conda-pypi-map = false

[dependencies]
# Pinned low bounds only; the lock pins the exact build. conda-forge is the primary channel
# (REFORMS prefers it); the two tools that are not packaged there come from PyPI below.
python = "3.11.*"
pip = "*"
# --- Goal 1: contracts and layered runtime types ---
icontract = ">=2.6"      # Design by Contract: @require / @ensure / invariants
pydantic = ">=2"         # external-boundary validation (O(N) coercion)
beartype = ">=0.18"      # internal hot-path checks (amortized O(1))
typeguard = ">=4"        # test-enclave runtime checking
# --- dev tooling the gate runs ---
pytest = ">=8"
ruff = ">=0.6"           # lint + format check
mypy = ">=1.10"          # static types, the layer above the runtime checks
# --- the code standards (beethoven-qa's docs/STANDARDS.md), the same lines as beethoven-qa's
# pixi.toml: each tool runs as its own process and is read through its JSON output; ruff above
# serves the readability group as well.
complexipy = ">=8"       # readability: cognitive complexity (Campbell, SonarSource)
radon = ">=6"            # design: McCabe complexity per method, the weights of WMC
bandit = ">=1.9"         # security: weaknesses mapped to CWE
coverage = ">=7.10"      # coverage: line coverage of the tests, read for the new lines only
pyyaml = ">=6"           # supply chain: the workflow files
types-pyyaml = ">=6"     # mypy's stubs for pyyaml
zizmor = ">=1.30"        # supply chain: the established auditor of the workflow files, beside the reader
lizard = ">=1.24"        # readability: lines of code per function (NLOC)

[pypi-dependencies]
# The symbolic-proof layer. CrossHair is published on PyPI only (not conda-forge); it pulls in
# z3-solver itself, so z3 is not declared separately (the overlap it brings is described above).
crosshair-tool = ">=0.0.60"
# The duplication detector (Rabin-Karp over tokens), published on PyPI as a self-contained binary
# wheel (manylinux_2_34; the glibc floor above). Read through its JSON report.
jscpd = ">=5.4"

[activation]
# The package and the pinned copy of beethoven-qa (vendor/beethoven-qa; beethoven-qa's own
# docs/CONSUMING.md says how it is taken and updated), imported without a build step. Absolute, so a `pixi run` started outside the root finds them too.
env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src:$PIXI_PROJECT_ROOT/vendor/beethoven-qa/src" }

[tasks]
# The verification gate, in the order a module must clear it. The pre-push hook runs
# `pixi run --locked gate`; CI runs the same tasks one by one after `pixi install --locked`, so a
# failure names its lane. Both read the same lock, so they check the same environment.
lint = "ruff check src tests && ruff format --check src tests"
typecheck = "mypy src"
test = "pytest -q"
# beethoven-qa's gate on this package ([tool.beethoven-qa] in pyproject.toml): every public function
# carries contracts, and CrossHair + Z3 find no input that satisfies a precondition while violating
# a postcondition, within the declared bound per condition.
symbolic = "python -m beethoven_qa gate"
# The pinned copy still hashes to its ORIGIN and the kit files equal the copy's.
vendor-check = "python -m beethoven_qa vendor-check"
# The code standards, each group on its own (beethoven-qa's docs/STANDARDS.md), on the code new
# since where this branch left the remote's default branch; CI runs each group as a step of one
# job (the kit's standards.yml).
standards = "python -m beethoven_qa standards all"
# The interface standard's five rules on what git tracks (the hub's INTERFACES.md, beethoven-qa's
# CONSUMING.md step 2): nothing reaches another checkout, interface/INTERFACE.json names every
# export and pinned copy, each copy holds what its ORIGIN lists, imports take only the published
# surface, and dependence runs one way.
boundary = "python -m beethoven_qa boundary"
gate = { depends-on = ["lint", "typecheck", "test", "boundary", "symbolic", "standards", "vendor-check"] }
# The evidence report (beethoven-qa's docs/REPORT.md): the lanes above, each command as its own
# process, written up with who decided each verdict, for anyone who doubts code written by an AI.
# Not a lane of the gate, which it would only run twice; its folder, report/, is never committed.
report = "python -m beethoven_qa report"
# The gate before every push, not only in CI: one command points git at the repository's hooks.
hooks = "git config core.hooksPath .githooks"
